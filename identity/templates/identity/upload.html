{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga - SecureID Engine</title>
    <link rel="stylesheet" href="{% static 'identity/css/style.css' %}">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <a href="{% url 'upload' %}" class="logo">
                SECUREID<span>ENGINE</span>
            </a>
            <nav class="nav-links">
                <a href="{% url 'upload' %}">Nueva Carga</a>
            </nav>
        </div>
    </header>
    <div class="card" style="max-width: 500px; margin: 50px auto;">
        <h2 style="text-align: center; color: #2d3436;">Verificación de Identidad</h2>
        <p style="text-align: center; color: #636e72;">Sube una imagen clara de tu documento.</p>
        
        <hr style="border:0; border-top: 1px solid #eee; margin: 20px 0;">


        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mode-switch-wrapper">
                <span style="font-size: 0.8em; color: #636e72;">Modo Verificador</span>
                <label class="switch">
                    <input type="checkbox" id="mode-toggle" name="mode_toggle">
                    <span class="slider"></span>
                </label>
            </div>
            
            {{ form.as_p }}

            <div id="selfie-section" style="display: none; margin-top: 20px;">
                <label>Foto del Rostro (Referencia):</label>
                <input type="file" name="face_image" id="face_input">
                <img id="face-preview" src="#" alt="Preview" style="display:none; max-width: 150px; margin-top: 10px;">
            </div>

            <img id="image-preview" src="#" alt="Vista previa de la identificación">

            <div style="text-align: center; margin-top: 25px;">
                <button type="submit" class="btn-secondary" style="width: 100%; border: none; cursor: pointer;">
                    Iniciar Procesamiento
                </button>
            </div>
        </form>

        <p style="text-align: center; margin-top: 20px;">
            <small style="color: #b2bec3;">
                Procesamiento asíncrono vía Celery.
            </small>
        </p>
    </div>

    <script>
        const imageInput = document.querySelector('input[type="file"]');
        const preview = document.getElementById('image-preview');

        imageInput.onchange = evt => {
            const [file] = imageInput.files;
            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
            }
        }

        const toggle = document.getElementById('mode-toggle');
        const selfieSection = document.getElementById('selfie-section');

        toggle.onchange = () => {
            selfieSection.style.display = toggle.checked ? 'block' : 'none';
        };
    </script>
</body>
</html>
